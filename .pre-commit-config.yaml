# Install once per clone: pre-commit install  (or: uv tool run pre-commit install)
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.21.2
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-added-large-files
      - id: check-merge-conflict
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: trailing-whitespace
  - repo: local
    hooks:
      # Regenerates docs/diagrams/architecture.md on every commit. If it changes, the
      # commit stops so you can review it, `git add docs/diagrams`, and commit again.
      - id: code-diagrams
        name: Regenerate code diagrams
        entry: python3 .claude/skills/changelog/changelog.py diagrams --fail-on-change
        language: system
        pass_filenames: false
        always_run: true
